plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.codex.sonyedge"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.sonyedge"
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName "0.4.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

tasks.register("archiveDebugApk") {
    doLast {
        def apkFile = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk").get().asFile
        if (!apkFile.exists()) {
            throw new GradleException("Debug APK not found: ${apkFile}")
        }

        def archiveDir = layout.buildDirectory.dir("outputs/versioned-apk").get().asFile
        archiveDir.mkdirs()

        def timestamp = new Date().format("yyyyMMdd-HHmmss")
        def versionName = android.defaultConfig.versionName
        def versionCode = android.defaultConfig.versionCode
        def archivedName = "SonyEdge-v${versionName}-${versionCode}-debug-${timestamp}.apk"

        copy {
            from apkFile
            into archiveDir
            rename { archivedName }
        }

        println "Archived versioned APK: ${new File(archiveDir, archivedName)}"
    }
}

tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("archiveDebugApk")
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.compose.foundation:foundation:1.7.5"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.compose.material:material-icons-extended:1.7.5"
    implementation "androidx.compose.ui:ui:1.7.5"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.5"
}
